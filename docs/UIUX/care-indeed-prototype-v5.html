        onMouseMove: (e) => {
          const r = e.currentTarget.getBoundingClientRect();
          e.currentTarget.style.setProperty('--mouse-x', `${((e.clientX - r.left)/r.width)*100}%`);
          e.currentTarget.style.setProperty('--mouse-y', `${((e.clientY - r.top)/r.height)*100}%`);
        }
      },
        h('div', { className: 'flex justify-between items-start' },

      );
    }

    function SurfaceCard({ children, className = '', onClick }) {
      const ref = useRef(null);
      const handleMove = (e) => {
        if (!ref.current) return;
        const r = ref.current.getBoundingClientRect();
        const x = ((e.clientX - r.left) / r.width) * 100;
        const y = ((e.clientY - r.top) / r.height) * 100;
        ref.current.style.setProperty('--mouse-x', `${x}%`);
        ref.current.style.setProperty('--mouse-y', `${y}%`);
      };
      const handleLeave = () => { if (ref.current) { ref.current.style.setProperty('--mouse-x', '50%'); ref.current.style.setProperty('--mouse-y', '50%'); } };
      return h('div', {
        ref, className: `surface-card spotlight-card ${className}`,
        onClick, onMouseMove: handleMove, onMouseLeave: handleLeave
      }, children);
    }

      }
    }

    function SidebarItem({ page, active, collapsed, onClick }) {
      const iconKey = page.pageId.includes('dashboard') ? 'dashboard' : (page.pageId.includes('library') || page.pageId.includes('policy') ? 'library' : (page.pageId.includes('form') ? 'forms' : (page.pageId.includes('calendar') ? 'calendar' : (page.pageId.includes('evidence') ? 'evidence' : (page.pageId.includes('journey') ? 'users' : (page.pageId.includes('clinician') || page.pageId.includes('patient') ? 'users' : (page.pageId.includes('iadmin') ? 'shield' : 'help')))))));
      const icon = Icons[iconKey] || Icons.dashboard;
      return h('button', {
        onClick,
        'aria-current': active ? 'page' : undefined,
        className: `nav-item w-full text-left mb-px ${active ? 'active' : ''}`,
        title: collapsed ? page.label : undefined
      },
        h(icon, { className: 'nav-icon', width: 17, height: 17 }),
        h('span', { className: 'truncate' }, page.label)
      );
    }

    function TopBar({ currentPage, onCommand, onThemeToggle, isDark, onNotifications, onProfile, sidebarCollapsed, setSidebarCollapsed }) {
      const logoSrc = isDark ? LOGO_DARK : LOGO_LIGHT;
      const dateStr = new Date().toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
      return h('header', { className: 'topbar flex items-center justify-between px-5 flex-shrink-0 z-40' },
        h('div', { className: 'flex items-center gap-3' },
          h('button', { onClick: () => setSidebarCollapsed(!sidebarCollapsed), className: 'p-2 text-v3-text-secondary hover:text-v3-text-primary lg:hidden rounded-xl focus-ring' }, h(Icons.menu, {width:19, height:19})),
          h('img', { src: logoSrc, alt: 'Care Indeed', className: 'topbar-logo h-[26px] w-auto', onError: (e) => { e.target.style.display='none'; } })
        ),
        h('div', { className: 'flex-1 flex justify-center px-4' },
          h('button', {
            onClick: onCommand,
            className: 'hidden md:flex items-center gap-2.5 px-5 py-[9px] rounded-3xl text-sm border border-v3-border bg-white/5 hover:bg-white/10 text-v3-text-secondary focus-ring'
          },
            h(Icons.search, { width:15, height:15 }),
            h('span', { className: 'text-[13px] opacity-80' }, currentPage.label),
            h('span', { className: 'ml-1 text-[9px] px-1.5 py-px rounded bg-white/10 font-mono tracking-[1.5px]' }, '⌘K')
          )
        ),
        h('div', { className: 'flex items-center gap-1.5' },
          h('div', { className: 'hidden lg:block text-xs px-3 py-1 text-v3-text-tertiary border border-v3-border-subtle rounded-2xl' }, dateStr),
          h('button', { onClick: onNotifications, className: 'p-2.5 rounded-2xl border border-v3-border-subtle text-v3-text-secondary hover:text-v3-text-primary relative focus-ring' },
            h(Icons.bell, { width:17, height:17 }),
            h('span', { className: 'absolute top-2 right-2 w-2 h-2 bg-v3-orange rounded-full' })
          ),
          h('button', { onClick: onThemeToggle, className: 'p-2.5 rounded-2xl border border-v3-border-subtle text-v3-text-secondary hover:text-v3-text-primary focus-ring' },
            isDark ? h(Icons.sun, {width:17, height:17}) : h(Icons.moon, {width:17, height:17})
          ),
          h('div', { onClick: onProfile, className: 'flex items-center gap-2 ml-1 pl-2 cursor-pointer' },
            h('div', { className: 'w-8 h-8 rounded-full bg-gradient-to-br from-v3-teal to-v3-teal-light flex items-center justify-center text-[10px] font-bold text-black' }, 'OP'),
            h('div', { className: 'hidden md:block text-xs leading-tight' },
              h('div', { className: 'font-medium' }, 'Olivia Park'),
              h('div', { className: 'text-v3-text-tertiary -mt-px' }, 'Administrator')
            )
          )
        )
      );
    }

    function Sidebar({ collapsed, setCollapsed, currentPageId, navigateToPage }) {
      const groups = [...COMPONENT_GROUPS].sort((a,b)=>a.order-b.order);
      return h('aside', {
        className: `sidebar-rail flex-shrink-0 hidden lg:flex flex-col py-3 ${collapsed ? 'collapsed' : 'expanded'}`
      },
        h('div', { className: 'px-2.5 flex flex-col flex-1 overflow-y-auto custom-scroll' },
          h('div', { className: 'px-2.5 mb-2 flex justify-between items-center' },
            !collapsed && h('div', { className: 'text-[10px] tracking-[1.5px] text-v3-text-tertiary font-semibold' }, 'COMMAND CENTER'),
            h('button', { onClick: () => setCollapsed(!collapsed), className: 'text-v3-text-tertiary hover:text-v3-text-primary p-1', 'aria-label': collapsed ? 'Expand sidebar' : 'Collapse sidebar' },
              h(collapsed ? Icons.chevronRight : Icons.arrowUp, {width:13, height:13})
            )
          ),
          groups.map(group => {
            const pages = getPagesForComponent(group.componentId);
            if (!pages.length) return null;
            return h('div', { key: group.componentId },
              !collapsed && h('div', { className: 'sidebar-group-label mt-3' }, group.label),
              pages.map(page => h(SidebarItem, {
                key: page.pageId,
                page: {...page, icon: page.pageId.includes('dashboard') ? 'dashboard' : (page.pageId.includes('library') || page.pageId.includes('policy') ? 'library' : (page.pageId.includes('form') ? 'forms' : (page.pageId.includes('calendar') ? 'calendar' : (page.pageId.includes('evidence') ? 'evidence' : (page.pageId.includes('journey') ? 'users' : (page.pageId.includes('clinician') || page.pageId.includes('patient') ? 'users' : (page.pageId.includes('iadmin') ? 'shield' : 'help')))))))},
                active: currentPageId === page.pageId,
                collapsed,
                onClick: () => navigateToPage(page.pageId)
              }))
            );
          })
        )
      );
    }

    function CommandSearch({ isOpen, onClose, navigateToPage, query, setQuery, activeIndex, setActiveIndex }) {
      const filtered = useMemo(() => {
        const q = query.toLowerCase().trim();
        if (!q) return PAGE_REGISTRY;
        return PAGE_REGISTRY.filter(p => p.label.toLowerCase().includes(q) || p.pageId.toLowerCase().includes(q));
      }, [query]);

      const handleKeyDown = useCallback((e) => {
        if (!isOpen) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); setActiveIndex(Math.min(activeIndex + 1, filtered.length - 1)); }
        if (e.key === 'ArrowUp') { e.preventDefault(); setActiveIndex(Math.max(activeIndex - 1, 0)); }
        if (e.key === 'Enter') {
          e.preventDefault();
          const sel = filtered[activeIndex];
          if (sel) { navigateToPage(sel.pageId); onClose(); setQuery(''); setActiveIndex(0); }
        }
        if (e.key === 'Escape') { onClose(); setQuery(''); }
      }, [isOpen, filtered, activeIndex, navigateToPage, onClose, setQuery, setActiveIndex]);

      useEffect(() => {
        if (isOpen) window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isOpen, handleKeyDown]);

      if (!isOpen) return null;

      return h('div', { className: 'fixed inset-0 z-[90] flex items-start justify-center pt-[12vh] bg-black/70 backdrop-blur-sm', onClick: () => { onClose(); setQuery(''); } },
        h('div', { className: 'command-modal w-full max-w-[620px] mx-4 glass-surface border border-v3-border rounded-3xl overflow-hidden shadow-2xl', onClick: e => e.stopPropagation() },
          h('div', { className: 'flex items-center gap-3 px-5 py-4 border-b border-v3-border-subtle' },
            h(Icons.search, { width:18, height:18, className: 'text-v3-text-tertiary' }),
            h('input', { autoFocus: true, value: query, onChange: e => { setQuery(e.target.value); setActiveIndex(0); }, placeholder: 'Jump to any page in the registry…', className: 'flex-1 bg-transparent outline-none text-lg placeholder:text-v3-text-tertiary' }),
            h('div', { className: 'text-[10px] px-1.5 py-px border border-v3-border-subtle rounded font-mono text-v3-text-tertiary' }, 'ESC')
          ),
          h('div', { className: 'max-h-[360px] overflow-y-auto custom-scroll py-1' },
            filtered.length === 0 ? h('div', { className: 'px-5 py-9 text-center text-sm text-v3-text-tertiary' }, 'No matches found.') :
            filtered.map((page, idx) => h('div', {
              key: page.pageId,
              onClick: () => { navigateToPage(page.pageId); onClose(); setQuery(''); setActiveIndex(0); },
              className: `command-result flex items-center gap-3.5 px-5 py-[10px] mx-1 cursor-pointer rounded-2xl ${idx === activeIndex ? 'active' : ''}`
            },
              h(Icons[page.pageId.includes('dashboard')?'dashboard':(page.pageId.includes('library')?'library':'help')], { width:16, height:16, className:'text-v3-text-secondary flex-shrink-0' }),
              h('div', { className: 'flex-1 font-medium tracking-tight' }, page.label),
              h('div', { className: 'text-xs text-v3-text-tertiary font-mono' }, page.pageId)
            ))
          ),
          h('div', { className: 'px-5 py-[9px] border-t border-v3-border-subtle text-[10px] flex gap-5 text-v3-text-tertiary bg-black/10' }, h('span', null, '↑↓ Navigate'), h('span', null, '↵ Select'), h('span', null, '⌘K / Ctrl+K'))
        )
      );
    }

    function LoginPage({ onEnter, isDark, toggleTheme }) {
      const [email, setEmail] = useState('robert@careindeed.com');
      const [password, setPassword] = useState('demo2026');
      const [loading, setLoading] = useState(false);
      const [message, setMessage] = useState(null);

      const logoSrc = isDark ? LOGO_DARK : LOGO_LIGHT;

      const handleEnter = () => {
        setLoading(true);
        setTimeout(() => {
          setLoading(false);
          if (typeof onEnter === 'function') onEnter();
        }, 460);
      };

      return h('div', { className: 'min-h-screen w-full flex items-center justify-center px-5 relative', style: { background: isDark ? 'linear-gradient(160deg, #05060A 0%, #0C1220 65%)' : '#FAF9F6' } },
        isDark && h('div', { style: { position:'absolute', inset:0, background:'radial-gradient(ellipse at 40% 18%, rgba(0,209,193,0.035) 0%, transparent 58%)', pointerEvents:'none' } }),
        h('div', { className: 'absolute top-6 right-6' },
          h('button', { onClick: toggleTheme, className: 'flex items-center gap-2 px-4 py-1.5 rounded-2xl text-xs border border-v3-border-subtle text-v3-text-secondary hover:text-v3-text-primary' },
            isDark ? h(Icons.sun, {width:14,height:14}) : h(Icons.moon, {width:14,height:14}),
            h('span', null, isDark ? 'Light' : 'Dark')
          )
        ),
        h('div', { className: 'w-full max-w-[430px] relative z-10' },
          h('div', { className: 'login-glass border border-v3-border rounded-3xl p-9' },
            h('div', { className: 'flex justify-center mb-8' },
              h('img', { src: logoSrc, alt: 'Care Indeed', style: { height: '44px', width: 'auto' }, onError: e => e.target.style.display = 'none' })
            ),
            h('div', { className: 'text-center mb-8' },
              h('div', { className: 'eyebrow text-v3-text-tertiary tracking-[2.6px]' }, 'HOME HEALTH • COMPLIANCE'),
              h('h1', { className: 'text-[29px] font-semibold tracking-[-0.02em] mt-2.5' }, 'Sign in'),
              h('p', { className: 'text-v3-text-secondary mt-1' }, 'Secure access to the Command Center')
            ),
            message && h('div', { className: `mb-5 px-4 py-2.5 text-sm rounded-2xl border ${message.type==='success' ? 'border-emerald-400/30 bg-emerald-400/5 text-emerald-400' : ''}` }, message.text),
            h('div', { className: 'space-y-4' },
              h('div', null,
                h('div', { className: 'text-xs uppercase tracking-widest text-v3-text-tertiary mb-1.5 ml-0.5' }, 'EMAIL'),
                h('input', { value: email, onChange: e=>setEmail(e.target.value), className: 'w-full bg-transparent border border-v3-border px-4 py-[13px] rounded-2xl text-sm focus:border-v3-teal-light focus:outline-none', placeholder: 'you@careindeed.com' })
              ),
              h('div', null,
                h('div', { className: 'text-xs uppercase tracking-widest text-v3-text-tertiary mb-1.5 ml-0.5' }, 'PASSWORD'),
                h('input', { type:'password', value: password, onChange: e=>setPassword(e.target.value), className: 'w-full bg-transparent border border-v3-border px-4 py-[13px] rounded-2xl text-sm focus:border-v3-teal-light focus:outline-none', placeholder: '••••••••' })
              )
            ),
            h('button', { onClick: handleEnter, disabled: loading, className: 'mt-7 w-full py-[15px] rounded-2xl font-semibold text-sm tracking-[0.6px] transition-all active:scale-[0.985] bg-gradient-to-r from-v3-teal to-[#009E8F] text-black' }, loading ? 'ENTERING…' : 'SIGN IN'),
            h('div', { className: 'h-px bg-v3-border-subtle my-6' }),
            h('button', {
              onClick: onEnter,
              className: 'w-full py-3.5 rounded-2xl border border-v3-border text-sm tracking-[0.4px] font-medium hover:border-v3-teal-light hover:text-v3-teal-light transition-all'
            }, 'ENTER PROTOTYPE')
          ),
          h('div', { className: 'text-center text-[10px] mt-5 text-v3-text-tertiary tracking-[1px]' }, 'Dark is default • Full registry • Keyboard ready')
        )
      );
    }

    function App() {
      const [showLogin, setShowLogin] = useState(true);
      const [currentPageId, setCurrentPageId] = useState('page.dashboard');
      const [isDark, setIsDark] = useState(true);
      const [sidebarCollapsed, setSidebarCollapsed] = useState(() => {
        try { return localStorage.getItem(SIDEBAR_KEY) === 'true'; } catch { return false; }
      });
      const [commandOpen, setCommandOpen] = useState(false);
      const [commandQuery, setCommandQuery] = useState('');
      const [activeCommandIndex, setActiveCommandIndex] = useState(0);
      const [activeDrawer, setActiveDrawer] = useState(null);
      const [activeModal, setActiveModal] = useState(null);
      const [filtersOpen, setFiltersOpen] = useState(false);
      const [notificationsOpen, setNotificationsOpen] = useState(false);

      const data = useMemo(() => createSampleData(), []);
      const currentPage = PAGE_BY_ID[currentPageId] || PAGE_REGISTRY[0];

      useEffect(() => {
        const root = document.documentElement;
        if (isDark) {
          root.removeAttribute('data-theme');
        } else {
          root.setAttribute('data-theme', 'light');
        }
        try { localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light'); } catch {}
      }, [isDark]);

      useEffect(() => {
        try { localStorage.setItem(SIDEBAR_KEY, sidebarCollapsed); } catch {}
      }, [sidebarCollapsed]);

      useEffect(() => {
        document.documentElement.classList.add('dark');
        const saved = localStorage.getItem(THEME_KEY);
        if (saved === 'light') setIsDark(false);
      }, []);

      useEffect(() => {
        function globalKey(e) {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setCommandOpen(o => !o);
            setCommandQuery('');
            setActiveCommandIndex(0);
          }
          if (e.key === 'Escape') {
            if (commandOpen) { setCommandOpen(false); setCommandQuery(''); }
            else if (activeDrawer) setActiveDrawer(null);
            else if (notificationsOpen) setNotificationsOpen(false);
          }
        }
        window.addEventListener('keydown', globalKey);
        return () => window.removeEventListener('keydown', globalKey);
      }, [commandOpen, activeDrawer, notificationsOpen]);

      const navigateToPage = useCallback((pageId) => {
        setCurrentPageId(pageId);
        setCommandOpen(false);
        setCommandQuery('');
        const pg = PAGE_BY_ID[pageId];
        if (pg && Math.random() > 0.72 && ['registry-table', 'profile-list', 'board'].includes(pg.templateType)) {
          setTimeout(() => setActiveDrawer({ type: pg.templateType === 'registry-table' ? 'policy' : 'profile', data: data.policies[0] || data.clinicians[0] }), 300);
        }
      }, [data]);

      function toggleTheme() { setIsDark(!isDark); }
      function enterPrototype() { setShowLogin(false); setCurrentPageId('page.dashboard'); }
      function closeDrawer() { setActiveDrawer(null); }

      if (showLogin) {
        return h(LoginPage, { onEnter: enterPrototype, isDark, toggleTheme });
      }

      return h('div', { className: 'shell-root flex flex-col', 'data-theme': isDark ? undefined : 'light' },
        h(TopBar, {
          currentPage,
          onCommand: () => { setCommandOpen(true); setCommandQuery(''); setActiveCommandIndex(0); },
          onThemeToggle: toggleTheme,
          isDark,
          onNotifications: () => setNotificationsOpen(true),
          onProfile: () => setActiveModal({title: 'Profile', content: 'Olivia Park • Administrator • Full registry access'}),
          sidebarCollapsed,
          setSidebarCollapsed
        }),

        h('div', { className: 'flex flex-1 min-h-0' },
          h(Sidebar, {
            collapsed: sidebarCollapsed,
            setCollapsed: setSidebarCollapsed,
            currentPageId,
            navigateToPage
          }),

          h('main', { className: 'flex-1 min-w-0 flex flex-col bg-[var(--v3-base-bg)] relative' },
            h('div', { className: 'content-frame custom-scroll' },
              h('div', { className: 'max-w-[1190px] mx-auto' },
                h(PageHeader, {
                  title: currentPage.label,
                  subtitle: (GROUP_BY_ID[currentPage.componentGroup] || {}).label || 'OPERATIONS',
                  actions: h('div', { className: 'hidden sm:flex items-center gap-2 text-xs text-v3-text-tertiary' }, 'Prototype • All pages live')
                }),
                renderTemplate({
                  templateType: currentPage.templateType,
                  currentPageId,
                  setActiveDrawer,
                  data
                })
              )
            ),

            h('div', { className: 'px-8 py-2.5 border-t border-v3-border-subtle text-[10px] text-v3-text-tertiary flex-shrink-0 flex items-center justify-between' },
              h('div', null, 'Care Indeed • Policies & Procedures • Prototype — 12 groups, ' + PAGE_REGISTRY.length + ' pages'),
              h('div', { className: 'font-mono opacity-40' }, 'ESC • ⌘K')
            )
          )
        ),

        h(CommandSearch, {
          isOpen: commandOpen,
          onClose: () => { setCommandOpen(false); setCommandQuery(''); },
          navigateToPage,
          query: commandQuery,
          setQuery: setCommandQuery,
          activeIndex: activeCommandIndex,
          setActiveIndex: setActiveCommandIndex
        }),

        h(Drawer, {
          isOpen: !!activeDrawer,
          onClose: closeDrawer,
          title: activeDrawer ? (activeDrawer.type.charAt(0).toUpperCase() + activeDrawer.type.slice(1)) : '',
          children: activeDrawer && h('div', null,
            activeDrawer.type === 'policy' && h('div', null, h('div', { className: 'text-xs text-v3-text-tertiary' }, activeDrawer.data.id), h('div', { className: 'text-xl font-semibold mt-1' }, activeDrawer.data.title), h('div', { className: 'mt-6 text-sm text-v3-text-secondary' }, 'All versions, appendices, and cross-links are accessible via the live registry.')),
            activeDrawer.type === 'task' && h('div', null, h('div', { className: 'font-semibold text-xl' }, activeDrawer.data.title), h('div', { className: 'mt-4' }, h(StatusBadge, { status: activeDrawer.data.status }))),
            activeDrawer.type === 'profile' && h('div', null, h('div', { className: 'font-semibold text-xl' }, activeDrawer.data.name), h('div', { className: 'text-sm mt-1 text-v3-text-secondary' }, activeDrawer.data.role || activeDrawer.data.program)),
            activeDrawer.type === 'evidence-new' && h('div', null, h('div', { className: 'text-lg font-semibold mb-3' }, 'Capture Evidence'), h('div', { className: 'space-y-3 text-sm' }, h('div', { className: 'glass-panel p-4 border border-v3-border-subtle' }, 'Upload supporting file or link'), h('button', { onClick: closeDrawer, className: 'w-full py-3 border border-v3-teal-light text-v3-teal-light rounded-2xl text-sm' }, 'SUBMIT TO CES'))),
            (activeDrawer.type === 'kpi' || activeDrawer.type === 'event' || activeDrawer.type === 'journey') && h('pre', { className: 'text-xs p-4 rounded-xl bg-black/30' }, JSON.stringify(activeDrawer.data, null, 2)),
            activeDrawer.type === 'matrix-update' && h('div', null, 'Access for ', activeDrawer.data.page, ' updated to ', h('span', { className: 'font-semibold' }, activeDrawer.data.access))
          )
        }),

        notificationsOpen && h('div', { className: 'fixed inset-0 z-[92] flex justify-end', onClick: () => setNotificationsOpen(false) },
          h('div', { className: 'w-full max-w-xs glass-surface border-l border-v3-border p-5', onClick: e => e.stopPropagation() },
            h('div', { className: 'font-semibold mb-4 flex justify-between' }, 'Notifications', h('button', { onClick: () => setNotificationsOpen(false) }, h(Icons.close, {width:15,height:15}))),
            h('div', { className: 'space-y-4 text-sm' },
              h('div', { className: 'p-3 border border-v3-border-subtle rounded-2xl' }, 'QAPI review completed by Marites'),
              h('div', { className: 'p-3 border border-v3-border-subtle rounded-2xl' }, 'New evidence packet ready for verification'),
              h('div', { className: 'p-3 border border-v3-border-subtle rounded-2xl' }, 'ACHC survey alignment updated')
            )
          )
        ),

        activeModal && h(Modal, { isOpen: true, onClose: () => setActiveModal(null), title: activeModal.title },
          h('div', { className: 'text-sm text-v3-text-secondary' }, activeModal.content)
        )
      );
    }

    function bootstrap() {
      const root = createRoot(document.getElementById('root'));
      root.render(h(App));
      document.documentElement.style.setProperty('--v3-base-bg', '#05060A');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }
  </script>
</body>
</html>
