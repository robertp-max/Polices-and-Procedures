<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Care Indeed • Prototype v5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Outfit:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');

    :root {
      /* === EXACT CI-ION / V3 VEIL GLASS TOKEN MAP (from UI_TOKEN_CONTRACT_SPEC + index.css + ui-staging.css + v3Tokens) === */
      --v3-base-bg: #05060A;
      --v3-bg-gradient: radial-gradient(circle at 50% 0%, #121724 0%, #05060A 100%);
      --v3-glass-card: linear-gradient(135deg, rgba(32, 41, 56, 0.88) 0%, rgba(16, 20, 28, 0.45) 60%, rgba(8, 10, 13, 0.98) 100%);
      --v3-glass-blur: blur(32px) saturate(140%);
      --v3-glass-shadow: 30px 10px 80px rgba(0, 0, 0, 0.9);
      --v3-border: rgba(255, 255, 255, 0.33);
      --v3-border-hover: rgba(255, 255, 255, 0.45);
      --v3-border-subtle: rgba(255, 255, 255, 0.12);
      --v3-teal: #007970;
      --v3-teal-light: #00D1C1;
      --v3-orange: #E07B2C;
      --v3-orange-light: #FFA059;
      --v3-text-primary: #FFFFFF;
      --v3-text-secondary: #94A3B8;
      --v3-text-tertiary: #64748B;
      --v3-ease: cubic-bezier(0.16, 1, 0.3, 1);
      --v3-duration: 0.7s;
      --v3-duration-fast: 0.4s;
      --v3-duration-sub: 0.55s;
      --v3-card-radius: 24px;
      --v3-veil-blur: 32px;
      --v3-veil-saturate: 1.4;

      /* CI Brand / Surface tokens (from index.css) */
      --ci-maroon-deep: #0A0202;
      --ci-maroon-black: #310707;
      --ci-maroon-base: #420808;
      --ci-maroon-glow: #5D0E0E;
      --ci-gold: #E07B2C;
      --ci-gold-dark: #FFA059;
      --ci-accent-rgb: 224, 123, 44;
      --ci-text: #E0E0E0;
      --ci-text-muted: rgba(255,255,255,0.45);
      --ci-border: rgba(255,255,255,0.08);
      --ci-border-strong: rgba(255,255,255,0.14);
      --ci-hairline: rgba(255,255,255,0.06);
      --glass-main: linear-gradient(160deg, rgba(66,8,8,0.33) 0%, rgba(10,2,2,0.33) 100%);
      --shadow-glass: 0 40px 120px -30px rgba(0,0,0,.85), 0 18px 48px -18px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07);
      --ease-standard: cubic-bezier(.22,1,.36,1);
      --ease-drift: cubic-bezier(.45,0,.55,1);

      /* Typography tokens */
      --ci-font-size-display-hero: 42px;
      --ci-font-size-display-section: 26px;
      --ci-font-size-kpi-value: 36px;
      --ci-font-size-stat-value: 18px;
      --ci-font-size-card-title: 15px;
      --ci-font-size-body-sm: 13px;
      --ci-font-size-body-xs: 12px;
      --ci-font-size-meta: 11px;
      --ci-font-size-eyebrow: 10px;

      /* Shell */
      --ci-shell-navrail-width: 16rem;
      --ci-shell-collapsed-width: 72px;

      /* Motion */
      --motion-premium: cubic-bezier(0.16, 1, 0.3, 1);

      /* Overlays & Surfaces */
      --ci-overlay-faint: rgba(255,255,255,0.02);
      --ci-overlay-soft: rgba(255,255,255,0.04);
      --ci-overlay-strong: rgba(255,255,255,0.08);
      --ci-overlay-border: rgba(255,255,255,0.08);
      --ci-overlay-border-strong: rgba(255,255,255,0.14);
    }

    /* DARK is DEFAULT — full-bleed premium dark glass */
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: var(--v3-base-bg);
      color: var(--v3-text-primary);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Light mode overrides (data-theme="light") */
    [data-theme="light"] {
      --v3-base-bg: #F8FAFC;
      --v3-bg-gradient: linear-gradient(160deg, #F1F5F9 0%, #F8FAFC 100%);
      --v3-glass-card: linear-gradient(135deg, rgba(255,255,255,0.96) 0%, rgba(248,250,252,0.92) 100%);
      --v3-glass-blur: blur(18px) saturate(120%);
      --v3-glass-shadow: 0 10px 40px -15px rgba(15,23,42,0.12), 0 4px 12px -4px rgba(15,23,42,0.08);
      --v3-border: rgba(15,23,42,0.12);
      --v3-border-hover: rgba(15,23,42,0.22);
      --v3-border-subtle: rgba(15,23,42,0.06);
      --v3-text-primary: #0F172A;
      --v3-text-secondary: #475569;
      --v3-text-tertiary: #64748B;
      --ci-text: #1E2937;
      --ci-text-muted: #64748B;
      --ci-border: rgba(15,23,42,0.08);
      --ci-border-strong: rgba(15,23,42,0.14);
      --ci-hairline: rgba(15,23,42,0.06);
      --glass-main: linear-gradient(160deg, rgba(255,255,255,0.7) 0%, rgba(248,250,252,0.65) 100%);
      --shadow-glass: 0 10px 30px -10px rgba(15,23,42,0.1), inset 0 1px 0 rgba(255,255,255,0.8);
      --ci-overlay-faint: rgba(15,23,42,0.02);
      --ci-overlay-soft: rgba(15,23,42,0.05);
      --ci-overlay-strong: rgba(15,23,42,0.1);
    }

    /* Premium typography */
    h1, h2, .section-title { font-family: 'Outfit', system-ui, sans-serif; letter-spacing: -0.025em; }
    .eyebrow { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }

    /* Full-bleed shell (no outer 4-sided frame) */
    .shell-root {
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: var(--v3-base-bg);
    }

    /* Sidebar collapsed = exactly 72px */
    .sidebar-rail {
      width: 72px;
      transition: width 280ms var(--motion-premium);
    }
    .sidebar-rail.expanded {
      width: 256px; /* standard expanded */
    }

    /* Glass surfaces — premium expensive feel */
    .glass-surface {
      background: var(--v3-glass-card);
      backdrop-filter: var(--v3-glass-blur);
      -webkit-backdrop-filter: var(--v3-glass-blur);
      border: 1px solid var(--v3-border);
      box-shadow: var(--v3-glass-shadow);
      border-radius: var(--v3-card-radius);
    }

    .glass-panel {
      background: var(--v3-glass-card);
      backdrop-filter: var(--v3-glass-blur);
      -webkit-backdrop-filter: var(--v3-glass-blur);
      border: 1px solid var(--v3-border-subtle);
      border-radius: 16px;
      transition: all 180ms var(--motion-premium);
    }

    /* Topbar premium */
    .topbar {
      height: 72px;
      background: rgba(5,6,10,0.85);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--v3-border-subtle);
      transition: background 200ms ease;
    }
    [data-theme="light"] .topbar {
      background: rgba(248,250,252,0.92);
    }

    /* Nav items */
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 12px; border-radius: 10px;
      font-size: 13px; font-weight: 600; letter-spacing: -0.01em;
      color: var(--v3-text-secondary);
      transition: all 140ms var(--motion-premium);
    }
    .nav-item:hover {
      color: var(--v3-text-primary);
      background: rgba(255,255,255,0.05);
    }
    .nav-item.active {
      color: var(--v3-teal-light);
      background: rgba(0, 121, 112, 0.12);
      border: 1px solid rgba(0,209,193,0.2);
    }
    .sidebar-rail.collapsed .nav-item {
      justify-content: center; padding: 10px; gap: 0;
    }
    .sidebar-rail.collapsed .nav-item span { display: none; }

    /* Command palette / Search modal */
    .command-modal {
      animation: commandEnter 180ms var(--motion-premium) both;
    }
    @keyframes commandEnter {
      from { opacity: 0; transform: translateY(-12px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .command-result {
      transition: all 120ms var(--motion-premium);
    }
    .command-result:hover, .command-result.active {
      background: rgba(255,255,255,0.06);
      transform: translateX(2px);
    }
    [data-theme="light"] .command-result:hover,
    [data-theme="light"] .command-result.active {
      background: rgba(15,23,42,0.06);
    }

    /* Spotlight premium effect */
    .spotlight {
      position: relative;
      overflow: hidden;
    }
    .spotlight::before {
      content: '';
      position: absolute; inset: -50%;
      background: radial-gradient(circle at var(--spot-x,50%) var(--spot-y,50%), rgba(0,209,193,0.12), transparent 70%);
      opacity: 0;
      transition: opacity 220ms var(--motion-premium);
      pointer-events: none;
    }
    .spotlight:hover::before { opacity: 1; }

    /* Animations */
    .fade-in { animation: fadeIn 380ms var(--motion-premium) both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    .slide-up { animation: slideUp 280ms var(--motion-premium) both; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .slide-in-right { animation: slideInRight 240ms var(--motion-premium) both; }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: translateX(0); } }

    .premium-ease { transition: all 200ms var(--motion-premium); }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    /* Scrollbars premium (gold tint) */
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(224,123,44,0.25); border-radius: 999px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(224,123,44,0.42); }
    [data-theme="light"] .custom-scroll::-webkit-scrollbar-thumb { background: rgba(15,23,42,0.2); }

    /* Focus rings — beautiful */
    .focus-ring:focus-visible {
      outline: 2px solid var(--v3-teal-light);
      outline-offset: 3px;
      box-shadow: 0 0 0 4px rgba(0, 209, 193, 0.18);
    }

    /* KPI / Card polish */
    .kpi-value { font-size: 34px; line-height: 1; font-weight: 700; letter-spacing: -0.03em; font-family: 'Outfit', system-ui; }
    .section-header { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: var(--v3-text-tertiary); }

    /* Tables */
    .proto-table th {
      font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.1em;
      color: var(--v3-text-tertiary); padding-bottom: 8px;
    }
    .proto-table td { padding: 11px 8px; border-top: 1px solid var(--v3-border-subtle); font-size: 13.5px; }

    /* Drawer */
    .drawer {
      box-shadow: -28px 0 80px -20px rgba(0,0,0,0.6);
      animation: drawerSlide 260ms var(--motion-premium) both;
    }
    @keyframes drawerSlide { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* Top level content frame — full bleed inside shell */
    .content-frame {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 28px 36px;
    }

    /* Beautiful subtle prototype badge */
    .proto-badge {
      font-size: 10px;
      letter-spacing: 1.5px;
      padding: 1px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--v3-text-tertiary);
    }
    [data-theme="light"] .proto-badge {
      background: rgba(15,23,42,0.04);
      border-color: rgba(15,23,42,0.08);
      color: #64748B;
    }

    .nav-icon { width: 18px; height: 18px; flex-shrink: 0; }

    /* Login premium */
    .login-glass {
      background: var(--v3-glass-card);
      backdrop-filter: var(--v3-glass-blur);
      -webkit-backdrop-filter: var(--v3-glass-blur);
      box-shadow: var(--v3-glass-shadow);
    }

    .metric-card {
      transition: transform 160ms var(--motion-premium), box-shadow 160ms var(--motion-premium), border-color 160ms var(--motion-premium);
    }
    .metric-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 48px -12px rgba(0,0,0,0.6);
      border-color: var(--v3-border-hover);
    }
  </style>
</head>

    // ===== PAGE REGISTRY (full list from canonical shell nav + more for complete prototype) =====

      { id: 'dashboard', label: 'Dashboard', icon: 'dashboard', templateType: 'dashboard' },

    // ===== MAIN APP ORCHESTRATOR =====
    function App() {
      const [showLogin, setShowLogin] = useState(true);
      const [currentPageId, setCurrentPageId] = useState('dashboard');
      const [isDark, setIsDark] = useState(true);
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [searchOpen, setSearchOpen] = useState(false);
      const [commandQuery, setCommandQuery] = useState('');
      const [activeCommandIndex, setActiveCommandIndex] = useState(0);
      const [activeDrawer, setActiveDrawer] = useState(null);
      const [searchFocused, setSearchFocused] = useState(false);

      const data = useMemo(() => createSampleData(), []);

      // Theme application
      useEffect(() => {
        const root = document.documentElement;
        if (isDark) {
          root.removeAttribute('data-theme');
          root.classList.add('dark');
        } else {
          root.setAttribute('data-theme', 'light');
          root.classList.remove('dark');
        }
      }, [isDark]);

      // Keyboard handler — global: Cmd/Ctrl+K, Esc, arrows in search
      useEffect(() => {
        function handleKey(e) {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setSearchOpen(o => !o);
            setCommandQuery('');
            setActiveCommandIndex(0);
          }
          if (e.key === 'Escape') {
            if (searchOpen) {
              setSearchOpen(false);
              setCommandQuery('');
            } else if (activeDrawer) {
              setActiveDrawer(null);
            }
          }
          if (searchOpen) {
            const filtered = PAGE_REGISTRY.filter(p => p.label.toLowerCase().includes(commandQuery.toLowerCase()));
            if (e.key === 'ArrowDown') {
              e.preventDefault();
              setActiveCommandIndex(i => Math.min(i + 1, filtered.length - 1));
            }
            if (e.key === 'ArrowUp') {
              e.preventDefault();
              setActiveCommandIndex(i => Math.max(i - 1, 0));
            }
            if (e.key === 'Enter') {
              e.preventDefault();
              const sel = filtered[activeCommandIndex];
              if (sel) {
                setCurrentPageId(sel.id);
                setSearchOpen(false);
                setCommandQuery('');
                // Demo: open drawer on command select for certain pages
                if (['library', 'forms'].includes(sel.templateType)) {
                  setActiveDrawer({ type: sel.templateType === 'library' ? 'policy' : 'form', data: data.policies[0] || data.forms[0] });
                }
              }
            }
          }
        }
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [searchOpen, commandQuery, activeCommandIndex, activeDrawer, data]);

      // Page switching function (used by sidebar + command)
      const navigateToPage = useCallback((pageId) => {
        setCurrentPageId(pageId);
        // Close search if open
        setSearchOpen(false);
        setCommandQuery('');
        // Occasionally demo drawer on navigation for rich pages
        const page = PAGE_REGISTRY.find(p => p.id === pageId);
        if (page && Math.random() > 0.65 && ['library', 'forms', 'evidence'].includes(page.templateType)) {
          setTimeout(() => {
            const sample = page.templateType === 'library' ? data.policies[1] : (page.templateType === 'forms' ? data.forms[0] : { id: 'EVD-DEMO' });
            setActiveDrawer({ type: page.templateType === 'library' ? 'policy' : page.templateType, data: sample });
          }, 380);
        }
      }, [data]);

      const currentPage = PAGE_REGISTRY.find(p => p.id === currentPageId) || PAGE_REGISTRY[0];
      const templateType = currentPage.templateType;

      // Filtered command results
      const filteredCommands = useMemo(() => {
        return PAGE_REGISTRY.filter(p => p.label.toLowerCase().includes(commandQuery.toLowerCase()));
      }, [commandQuery]);

      // Login handler — "Enter Prototype"

        setShowLogin(false);
        setCurrentPageId('dashboard');
        setSidebarCollapsed(false);
        setActiveDrawer(null);
      }

        h('div', { className: 'flex flex-1 min-h-0' },

          // SIDEBAR — 72px collapsed
          h('aside', {
            className: `sidebar-rail flex-shrink-0 border-r border-v3-border-subtle bg-[#030406] flex flex-col py-4 overflow-hidden transition-all ${sidebarCollapsed ? 'collapsed' : 'expanded'} hidden lg:flex`
          },
            h('div', { className: 'px-2.5 flex flex-col flex-1 overflow-y-auto custom-scroll' },
              PAGE_REGISTRY.slice(0, 9).map(page => {
                const active = currentPageId === page.id;
                return h('button', {
                  key: page.id,
                  onClick: () => navigateToPage(page.id),
                  className: `nav-item w-full text-left mb-0.5 ${active ? 'active' : ''}`
                },
                  h(Icons[page.icon] || Icons.dashboard, { className: 'nav-icon', width: 17, height: 17 }),
                  h('span', { className: 'truncate' }, page.label)
                );
              }),

              h('div', { className: 'h-px bg-white/10 my-3 mx-2' }),

              PAGE_REGISTRY.slice(9).map(page => {
                const active = currentPageId === page.id;
                return h('button', {
                  key: page.id,
                  onClick: () => navigateToPage(page.id),
                  className: `nav-item w-full text-left mb-0.5 ${active ? 'active' : ''}`
                },
                  h(Icons[page.icon] || Icons.dashboard, { className: 'nav-icon', width: 17, height: 17 }),
                  h('span', { className: 'truncate' }, page.label)
                );
              })
            ),

            h('div', { className: 'px-3 mt-auto pt-3 border-t border-v3-border-subtle text-[10px] text-v3-text-tertiary mx-1.5' },
              'Full registry wired'
            )
          ),

          // CONTENT AREA — full-bleed beautiful glass
          h('main', { className: 'flex-1 min-w-0 flex flex-col bg-[var(--v3-base-bg)] relative' },
            h('div', { className: 'content-frame custom-scroll' },
              h('div', { className: 'max-w-[1200px] mx-auto' },
                // Top bar inside content with page title
                h('div', { className: 'flex items-center justify-between mb-6' },
                  h('div', null,
                    h('div', { className: 'eyebrow mb-px' }, currentPage.label.toUpperCase()),
                    h('div', { className: 'text-[22px] font-semibold tracking-[-0.015em]' }, currentPage.label)
                  ),
                  h('div', { className: 'text-xs px-4 py-1 rounded-2xl bg-white/5 border border-v3-border-subtle' }, 'Registry page • Live interactions')
                ),

                // THE TEMPLATE RENDER (switch/map)
                renderTemplate({
                  templateType,
                  currentPageId,
                  setActiveDrawer,
                  isDark,
                  data
                })
              )
            ),

            // Subtle footer note
            h('div', { className: 'px-7 py-3 border-t border-v3-border-subtle text-[10px] text-v3-text-tertiary flex-shrink-0 flex items-center justify-between' },
              h('div', {}, 'Care Indeed Policies & Procedures • Prototype v5 — fully self-contained single-file'),
              h('div', { className: 'font-mono tracking-[1px] opacity-40' }, 'ESC closes • ⌘K command')
            )
          )
        ),

        // COMMAND PALETTE MODAL
        searchOpen && h('div', { className: 'fixed inset-0 z-[90] flex items-start justify-center pt-[14vh] bg-black/70 backdrop-blur', onClick: () => setSearchOpen(false) },
          h('div', { className: 'command-modal w-full max-w-[640px] mx-4 glass-surface border border-v3-border rounded-3xl overflow-hidden shadow-2xl', onClick: e => e.stopPropagation() },
            h('div', { className: 'flex items-center gap-3 px-5 py-4 border-b border-v3-border-subtle bg-black/20' },
              h(Icons.search, { width: 18, height: 18, className: 'text-v3-text-tertiary' }),
              h('input', {
                autoFocus: true,
                value: commandQuery,
                onChange: (e) => { setCommandQuery(e.target.value); setActiveCommandIndex(0); },
                placeholder: 'Jump to page... (arrows + enter)',
                className: 'flex-1 bg-transparent outline-none text-lg placeholder:text-v3-text-tertiary'
              }),
              h('div', { className: 'text-[10px] font-mono text-v3-text-tertiary px-2 py-px border border-v3-border-subtle rounded' }, 'ESC')
            ),
            h('div', { className: 'max-h-[350px] overflow-y-auto custom-scroll py-1' },
              filteredCommands.length === 0 && h('div', { className: 'px-5 py-8 text-center text-sm text-v3-text-tertiary' }, 'No matches. Try another term.'),
              filteredCommands.map((page, index) =>
                h('div', {
                  key: page.id,
                  onClick: () => {
                    navigateToPage(page.id);
                  },
                  className: `command-result flex items-center gap-4 px-5 py-[11px] cursor-pointer mx-1 rounded-2xl ${index === activeCommandIndex ? 'active bg-white/5' : ''}`
                },
                  h(Icons[page.icon] || Icons.dashboard, { width: 17, height: 17, className: 'text-v3-text-secondary flex-shrink-0' }),
                  h('div', { className: 'flex-1 font-medium tracking-tight' }, page.label),
                  h('div', { className: 'text-xs text-v3-text-tertiary font-mono tracking-widest' }, page.id)
                )
              )
            ),
            h('div', { className: 'px-4 py-2 border-t border-v3-border-subtle bg-black/10 text-[10px] text-v3-text-tertiary flex gap-4' },
              h('span', null, '↑↓ Navigate'), h('span', null, '↵ Select'), h('span', null, '⌘K Toggle')
            )
          )
        ),

        // RIGHT DRAWER (activeDrawer)
        activeDrawer && h('div', { className: 'fixed inset-0 z-[95] flex justify-end bg-black/60', onClick: closeDrawer },
          h('div', {
            className: 'drawer w-full max-w-md h-full glass-surface border-l border-v3-border flex flex-col',
            onClick: e => e.stopPropagation()
          },
            h('div', { className: 'flex items-center justify-between px-6 py-4 border-b border-v3-border-subtle flex-shrink-0' },
              h('div', { className: 'font-semibold tracking-tight' }, activeDrawer.type === 'policy' ? 'Policy Detail' : activeDrawer.type.charAt(0).toUpperCase() + activeDrawer.type.slice(1)),
              h('button', { onClick: closeDrawer, className: 'p-1 text-v3-text-tertiary hover:text-white focus-ring' }, h(Icons.close, { width: 19, height: 19 }))
            ),
            h('div', { className: 'p-6 flex-1 overflow-auto custom-scroll text-sm leading-relaxed' },
              // Drawer content based on type
              activeDrawer.type === 'policy' && h('div', null,
                h('div', { className: 'uppercase text-xs text-v3-text-tertiary mb-1' }, activeDrawer.data.id),
                h('h3', { className: 'text-xl font-semibold mb-4 tracking-tight' }, activeDrawer.data.title),
                h('div', { className: 'grid grid-cols-2 gap-x-4 gap-y-3 text-sm' },
                  h('div', { className: 'text-v3-text-tertiary' }, 'Domain'), h('div', null, activeDrawer.data.domain),
                  h('div', { className: 'text-v3-text-tertiary' }, 'Owner'), h('div', null, activeDrawer.data.owner),
                  h('div', { className: 'text-v3-text-tertiary' }, 'Last Updated'), h('div', null, activeDrawer.data.updated),
                  h('div', { className: 'text-v3-text-tertiary' }, 'Cadence'), h('div', null, activeDrawer.data.template)
                ),
                h('div', { className: 'my-6 h-px bg-white/10' }),
                h('div', { className: 'text-[13px] text-v3-text-secondary' }, 'This policy is fully navigable in the live application. All controls, versions, and appendices are wired to the registry.')
              ),
              activeDrawer.type === 'form' && h('div', null,
                h('div', { className: 'uppercase text-xs text-v3-text-tertiary mb-1' }, activeDrawer.data.id),
                h('h3', { className: 'text-xl font-semibold mb-4' }, activeDrawer.data.title),
                h('div', null, 'Type: ', activeDrawer.data.type),
                h('div', { className: 'mt-3' }, 'Instances completed: ', h('span', { className: 'font-semibold text-v3-teal-light' }, activeDrawer.data.instances))
              ),
              (activeDrawer.type === 'event' || activeDrawer.type === 'kpi' || activeDrawer.type === 'domain' || activeDrawer.type === 'evidence') && h('div', null,
                h('pre', { className: 'text-xs bg-black/30 p-4 rounded-xl overflow-auto font-mono text-v3-text-secondary' }, JSON.stringify(activeDrawer.data, null, 2)),
                h('div', { className: 'mt-5 text-xs text-v3-text-tertiary' }, 'Drawer populated from sample data factory. All interactions are live.')
              ),
              activeDrawer.type === 'evidence-new' && h('div', null,
                h('div', { className: 'mb-4' }, 'New evidence capture workspace (demo)'),
                h('div', { className: 'space-y-3' },
                  h('div', { className: 'p-3 border border-v3-border-subtle rounded-2xl text-sm' }, 'Upload supporting artifact'),
                  h('div', { className: 'p-3 border border-v3-border-subtle rounded-2xl text-sm' }, 'Associate with regulatory event'),
                  h('button', { onClick: closeDrawer, className: 'mt-4 w-full py-2.5 rounded-2xl border border-v3-teal-light text-v3-teal-light text-xs tracking-widest' }, 'SUBMIT TO CES')
                )
              )
            ),
            h('div', { className: 'p-4 border-t border-v3-border-subtle text-[10px] text-v3-text-tertiary flex-shrink-0' }, 'Prototype drawer — fully interactive')
          )
        )
      );
    }

    // ===== BOOTSTRAP =====
    function bootstrap() {
      configureTailwind();
      const rootEl = document.getElementById('root');
      const root = createRoot(rootEl);
      root.render(h(App));

      // Ensure dark default on load (already handled in component but set explicit)
      document.documentElement.classList.add('dark');
      document.documentElement.style.setProperty('--v3-base-bg', '#05060A');
    }

    // Launch
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }
  </script>
</body>
</html>
