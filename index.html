<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="https://careindeed.com/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <meta name="theme-color" content="#14070d" />
    <title>Care Indeed Home Health Care, Inc. - Policies and Procedures</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Critical paint-blocking background — prevents flash before app CSS loads.
         Keeps the first paint aligned with the dark auth shell. -->
    <style>
      html, body, #root { background-color: #14070d !important; min-height: 100vh; margin: 0; padding: 0; }
      html { color-scheme: dark; }
    </style>
    <!-- Force CI-ION dark mode for unauthenticated auth entry. -->
    <script>
      try {
        document.documentElement.setAttribute('data-theme', 'ci-ion-dark');
        document.documentElement.setAttribute('data-ci-mode', 'dark');
        // Do not force the signed-in app shell when a stored auth session exists.
        if (!localStorage.getItem('ci_demo_auth_v1')) {
          localStorage.setItem('ci-shell-theme', 'ci-ion-dark');
          localStorage.setItem('ci-care-indeed-mode', 'dark');
        }
      } catch (e) { /* ignore */ }
    </script>
  </head>
  <body class="dark" style="background-color:#14070d;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
