<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="https://careindeed.com/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <meta name="theme-color" content="#05060A" />
    <title>Care Indeed Home Health Care, Inc. - Policies and Procedures</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Critical paint-blocking V3 background — prevents legacy light/maroon flash before app CSS loads. -->
    <style>
      html, body, #root { background-color: #05060A !important; min-height: 100vh; margin: 0; padding: 0; }
      html { color-scheme: dark; }
    </style>
    <!-- Force V3-only mode on first paint. V4 can later add a normal/light mode on top of V3 tokens. -->
    <script>
      try {
        document.documentElement.setAttribute('data-theme', 'v3-veil');
        document.documentElement.setAttribute('data-ci-mode', 'v3');
        localStorage.setItem('ci-shell-theme', 'v3-veil');
        localStorage.setItem('ci-care-indeed-mode', 'v3');
      } catch (e) { /* ignore */ }
    </script>
  </head>
  <body style="background-color:#05060A;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
