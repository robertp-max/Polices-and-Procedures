<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="https://careindeed.com/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Care Indeed Home Health Care, Inc. - Policies and Procedures</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Critical paint-blocking background — prevents flash before app CSS loads.
         Forces the neutral light-slate canvas the moment the HTML is parsed,
         eliminating the white/maroon/dark blink during cold loads on slow networks. -->
    <style>
      html, body, #root { background-color: #f8fafc !important; min-height: 100vh; margin: 0; padding: 0; }
      html { color-scheme: light; }
    </style>
    <!-- Force CI light mode as the default theme so first paint of the shell
         never renders maroon. The store reads these attributes if present. -->
    <script>
      try {
        document.documentElement.setAttribute('data-theme', 'care-indeed-light');
        document.documentElement.setAttribute('data-ci-mode', 'light');
        // One-time migration: clear any stale dark-mode preference from prior testing
        // so existing users don't see a stuck CI-ION dark shell.
        if (!localStorage.getItem('ci-light-default-v2')) {
          localStorage.setItem('ci-shell-theme', 'care-indeed-light');
          localStorage.setItem('ci-care-indeed-mode', 'light');
          localStorage.setItem('ci-light-default-v2', '1');
        }
      } catch (e) { /* ignore */ }
    </script>
  </head>
  <body class="light" style="background-color:#f8fafc;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
