    function DataTable({ view }) {
      const headers = view.tableHeaders || ['ID', 'Record', 'Owner / Domain', 'Status'];
      const records = view.records || [];
      const columnCount = Math.max(headers.length, ...records.map((row) => Array.isArray(row) ? row.length : headers.length), 1);
      const gridStyle = { gridTemplateColumns: `repeat(${columnCount}, minmax(0, 1fr))` };
      const statusPattern = /due|watch|blocked|draft|limited|review|partial|missing|pending|unknown|gap|required|deficient|risk|fail|awaiting|inprogress/i;
      const normalizedHeaders = Array.from({ length: columnCount }, (_, index) => headers[index] || `Field ${index + 1}`);
      const toCells = (row) => Array.isArray(row)
        ? Array.from({ length: columnCount }, (_, index) => row[index] ?? '')
        : normalizedHeaders.map((header) => row[header] || row[header.toLowerCase()] || '');

      return (
        <div className="overflow-hidden rounded-2xl border border-brand-neutral-200 bg-white shadow-soft">
          <div className="grid border-b border-brand-neutral-200 bg-brand-neutral-50 px-4 py-3 text-[10px] font-heading font-extrabold uppercase tracking-widest text-brand-neutral-400" style={gridStyle}>
            {normalizedHeaders.map((header) => <div key={header} className="min-w-0 pr-2">{header}</div>)}
          </div>
          <div className="divide-y divide-brand-neutral-100">
            {records.map((row, index) => {
              const cells = toCells(row);
              return (
                <div key={`${cells[0]}-${index}`} className="grid items-center px-4 py-3 text-sm hover:bg-brand-teal-50/40" style={gridStyle}>
                  {cells.map((cell, cellIndex) => {
                    const value = String(cell || '-');
                    if (cellIndex === 0) {
                      return <div key={cellIndex} className="min-w-0 pr-2 font-heading text-xs font-extrabold text-brand-teal-500">{value}</div>;
                    }
                    if (cellIndex === 1) {
                      return <div key={cellIndex} className="min-w-0 pr-2 text-xs font-medium text-brand-teal-600">{value}</div>;
                    }
                    if (cellIndex === cells.length - 1) {
                      return (
                        <div key={cellIndex} className="min-w-0 pr-2">
                          <ToneBadge tone={statusPattern.test(value) ? 'orange' : 'teal'}>{value}</ToneBadge>
                        </div>
                      );
                    }
                    return <div key={cellIndex} className="min-w-0 pr-2 text-xs leading-relaxed text-brand-neutral-400">{value}</div>;
                  })}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function CalendarEventItem({ view, event, index, children, surface = 'calendar-board', onOpenSwimlane }) {
      const [visible, setVisible] = useState(false);
      const [closing, setClosing] = useState(false);
      const [anchor, setAnchor] = useState(null);
      const closeTimer = useRef(null);

      const positionCard = (element) => {
        const trigger = element.querySelector('[data-calendar-event]') || element;
        const rect = trigger.getBoundingClientRect();
        const cardWidth = 320;
        const cardHeight = 340;
        const margin = 14;
        const minTop = 16;
        const boardRect = document.querySelector('[data-calendar-board]')?.getBoundingClientRect();
        const upcomingRect = document.querySelector('[data-calendar-upcoming]')?.getBoundingClientRect();
        const rightBoundary = Math.min(window.innerWidth - margin, upcomingRect ? upcomingRect.left - margin : window.innerWidth - margin);
        const boardLeft = boardRect ? boardRect.left + margin : margin;
        const boardRight = boardRect
          ? Math.min(boardRect.right - cardWidth - margin, rightBoundary - cardWidth)
          : rightBoundary - cardWidth;
        let left = rect.right + margin;
        let placement = 'right';

        if (left + cardWidth > rightBoundary) {
          left = rect.left - cardWidth - margin;
          placement = 'left';
        }

        if (left < boardLeft) {
          const centeredLeft = rect.left + rect.width / 2 - cardWidth / 2;
          left = Math.min(Math.max(centeredLeft, boardLeft), Math.max(boardLeft, boardRight));
          placement = 'center';
        }

        const top = Math.max(minTop, Math.min(rect.top + rect.height / 2 - cardHeight / 2, window.innerHeight - cardHeight - margin));
        setAnchor({ left, top, placement });
      };

      const showCard = (event) => {
        window.clearTimeout(closeTimer.current);
        positionCard(event.currentTarget);
        setVisible(true);
        setClosing(false);
      };

      const keepCardOpen = () => {
        window.clearTimeout(closeTimer.current);
        setVisible(true);
        setClosing(false);
      };

      const openSwimlane = (eventClick) => {
        eventClick?.preventDefault();
        eventClick?.stopPropagation();
        window.clearTimeout(closeTimer.current);
        setVisible(false);
        setClosing(false);
        onOpenSwimlane?.(event);
      };

      const closeCard = () => {
        window.clearTimeout(closeTimer.current);
        setClosing(true);
        closeTimer.current = window.setTimeout(() => {
          setVisible(false);
          setClosing(false);
        }, 1000);
      };

      useEffect(() => () => window.clearTimeout(closeTimer.current), []);

      return (
        <div
          className="relative"
          onMouseEnter={showCard}
          onMouseLeave={closeCard}
          onClick={openSwimlane}
          onFocus={showCard}
          onBlur={(event) => {
            if (!event.currentTarget.contains(event.relatedTarget)) closeCard();
          }}
        >
          {children}
          {ReactDOM.createPortal(
            <CalendarHoverCard view={view} event={event} index={index} visible={visible} closing={closing} anchor={anchor} surface={surface} onCardEnter={keepCardOpen} onCardLeave={closeCard} onOpenSwimlane={openSwimlane} />,
            document.body
          )}
        </div>
      );
    }

      const owner = event.owner || (index % 2 ? 'Clinical Manager' : 'Compliance Officer');

      const readiness = event.readiness || (toneName === 'orange' ? 'Needs review' : toneName === 'amber' ? 'Watch' : 'Ready');
      const risk = event.risk || (toneName === 'orange' ? 'High risk' : toneName === 'amber' ? 'Medium risk' : 'Low risk');
      const steps = event.steps || (toneName === 'orange' ? '5 active' : '3 active');
      const detail = event.detail || `${event.label} has owner, due date, evidence state, and swimlane context ready for review.`;
      const motionClass = visible && !closing
        ? 'pointer-events-auto translate-y-0 opacity-100 duration-150'
        : visible
          ? 'pointer-events-auto translate-y-2 opacity-0 duration-1000'
          : 'pointer-events-none translate-y-2 opacity-0 duration-1000';
      const placementClass = anchor?.placement === 'left' ? 'origin-right' : anchor?.placement === 'center' ? 'origin-top' : 'origin-left';
      const positionStyle = anchor ? { left: `${anchor.left}px`, top: `${anchor.top}px` } : {};

      return (
        <div
          data-calendar-hover-card
          data-calendar-surface={surface}
          data-event-label={event.label}
          data-open-state={visible && !closing ? 'open' : closing ? 'closing' : 'closed'}
          data-placement={anchor?.placement || 'right'}

          onFocus={onCardEnter}
          onBlur={onCardLeave}
          className={`fixed z-50 hidden w-80 max-w-[calc(100vw-2rem)] rounded-2xl border border-white/95 bg-white/95 p-4 text-left shadow-lift backdrop-blur-xl transition-all ease-out md:block ${placementClass} ${motionClass}`}
          style={positionStyle}
        >
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0">
              <ToneBadge tone={toneName}>{readiness}</ToneBadge>
              <h4 className="mt-3 font-heading text-base font-extrabold text-brand-teal-600">{event.label}</h4>

        case 'detail': return <DetailPrototype view={view} />;
        case 'policy-viewer': return <PolicyViewerPrototype view={view} />;
        case 'framework': return <FrameworkPrototype view={view} />;
        case 'achc-survey': return <AchcSurveyPrototype view={view} />;
        case 'achc-crosswalk': return <AchcCrosswalkPrototype view={view} />;
        case 'lifecycle': return <LifecyclePrototype view={view} />;
        case 'form': return <FormPrototype view={view} />;
        case 'form-viewer': return <FormViewerPrototype view={view} />;
        case 'ecign': return <EcignPrototype view={view} />;
        case 'journey': return <JourneyPrototype view={view} />;
        case 'admin': return <AdminPrototype view={view} />;
        case 'docs': return <DocsPrototype view={view} />;
        case 'reference-viewer': return <ReferenceViewerPrototype view={view} />;
        case 'survey-packet': return <SurveyPacketPrototype view={view} />;
        case 'surveyor-policy': return <SurveyorPolicyPrototype view={view} />;
        case 'overlays': return <OverlayPrototype view={view} />;
        case 'personal-ops': return <PersonalOpsPrototype view={view} />;
        case 'reports': return <ReportsPrototype view={view} />;
        case 'matrix':
        default: return <MatrixPrototype view={view} />;
      }
    }


    function MetricCard({ item }) {
      return (
        <div className="hover-lift transition-all duration-300">
          <MetricTile item={item} />
        </div>
      );
    }

    function RightRail({ children }) {
      return (
        <aside className="hidden xl:block w-80 shrink-0 border-l border-brand-teal-100/50 bg-white/40 backdrop-blur-xl p-6 overflow-y-auto">
          {children}
        </aside>
      );
    }

    function UpcomingEventCard({ title, date, tone }) {
      return (
        <div className="bg-white/80 backdrop-blur-lg hover:shadow-md hover-lift p-4 rounded-xl mb-3 border border-brand-teal-100/60 cursor-pointer">
          <div className="flex items-center gap-2 mb-2">
            <ToneBadge tone={tone}>{date}</ToneBadge>
          </div>
          <p className="text-sm font-bold text-brand-teal-700 leading-snug">{title}</p>
        </div>
      );
    }

    function StatusChip({ status, tone }) {
      return <ToneBadge tone={tone}>{status}</ToneBadge>;
    }

    function ActionIconButton({ icon, onClick, title, tone = 'teal' }) {
      return (
        <button title={title} onClick={onClick} className={`flex h-8 w-8 items-center justify-center rounded-full hover-lift transition bg-white/60 backdrop-blur-md border border-brand-teal-100/50 text-brand-${tone}-600 hover:bg-white`}>
          <Icon name={icon} className="h-4 w-4" />
        </button>
      );
    }

    function StatusLegend({ items }) {
      return (
        <div className="flex flex-wrap gap-4 mt-5 p-4 rounded-xl bg-white/40 border border-brand-teal-100/30 text-xs font-semibold text-slate-500">
          {items.map(item => (
            <div key={item.label} className="flex items-center gap-2">
              <span className={`h-2.5 w-2.5 rounded-full bg-brand-${item.tone}-500 shadow-sm`}></span>
              {item.label}
            </div>
          ))}
        </div>
      );
    }

    function AppShell({ children }) {
      return (
        <div className="prototype-shell min-h-screen">
          <div className="flex min-h-screen">
            {children}
          </div>
        </div>
      );
    }

    function Sidebar({ activeView, visibleGroups, sidebarCollapsed, setSidebarCollapsed, query, setQuery, goTo }) {
      return (
        <aside className={`bg-white/70 backdrop-blur-xl sticky top-0 hidden h-screen shrink-0 overflow-y-auto border-r border-[#004142]/10 shadow-[10px_0_28px_rgba(0,65,66,0.06)] transition-[width] duration-300 lg:block ${sidebarCollapsed ? 'w-[88px]' : 'w-[292px]'}`}>
          <div className={`flex items-center gap-3 pb-4 pt-6 ${sidebarCollapsed ? 'flex-col px-3' : 'justify-between px-6'}`}>
            <img
              src={sidebarCollapsed ? CAREINDEED_MARK_SRC : '/src/assets/ci-logo-gray.png'}
              alt="Care Indeed"
              className={`${sidebarCollapsed ? 'h-11 w-11 rounded-full object-contain' : 'h-12 w-auto object-contain'} transition-all duration-300`}
            />
            <button
              type="button"
              title={sidebarCollapsed ? 'Expand navigation' : 'Collapse navigation'}
              onClick={() => {
                if (!sidebarCollapsed) setQuery('');
                setSidebarCollapsed(!sidebarCollapsed);
              }}
              className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-brand-teal-100/50 bg-white hover-lift text-brand-teal-600 shadow-sm transition"
            >
              <Icon name={sidebarCollapsed ? 'panel-left-open' : 'panel-left-close'} className="h-4 w-4" />
            </button>
          </div>
          {!sidebarCollapsed && <div className="border-b border-transparent px-6 pb-5">
            <div className="rounded-2xl border border-brand-teal-100/50 bg-white/80 hover-lift p-4 shadow-sm flex items-center justify-between">
              <div>
                <div className="text-2xl font-heading font-extrabold text-brand-teal-700">{ALL_VIEWS.length}</div>
                <div className="text-[10px] font-heading font-extrabold uppercase tracking-wider text-slate-500">Views</div>
              </div>
              <Icon name="activity" className="h-6 w-6 text-brand-teal-400 opacity-50" />
            </div>
          </div>}
          <div className={`${sidebarCollapsed ? 'px-3 pb-4 pt-2' : 'p-4'}`}>
            {!sidebarCollapsed && <div className="relative mb-5">
              <Icon name="search" className="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" />
              <input value={query} onChange={(event) => setQuery(event.target.value)} placeholder="Filter views..." className="w-full rounded-xl border border-brand-teal-100/50 bg-white/80 py-2.5 pl-9 pr-3 text-sm shadow-sm outline-none focus:border-brand-teal-500 focus:bg-white transition-all duration-300 hover:shadow-md" />
            </div>}
            <nav className={sidebarCollapsed ? 'space-y-4' : 'space-y-6'}>
              {visibleGroups.map((group) => (
                <div key={group.title}>
                  {!sidebarCollapsed && <div className="mb-2 px-2 text-[10px] font-heading font-extrabold uppercase tracking-[0.2em] text-slate-400">{group.title}</div>}
                  <div className={sidebarCollapsed ? 'flex flex-col items-center gap-2' : 'space-y-1'}>
                    {group.items.map((item) => {
                      const active = item.id === activeView.id;
                      return (
                        <button
                          key={item.id}
                          title={item.label}
                          onClick={() => goTo(item.id)}
                          className={`flex items-center rounded-xl text-xs font-bold transition touch-manipulation active:scale-[0.985] ${sidebarCollapsed ? 'h-11 w-11 justify-center px-0 py-0 min-h-[44px] min-w-[44px]' : 'w-full gap-3 px-4 py-3 text-left min-h-[44px]'} ${active ? 'bg-[#004142] text-white shadow-md hover-lift' : 'text-slate-600 hover:bg-brand-teal-50 hover:text-brand-teal-700 hover:translate-x-1'}`}
                        >
                          <Icon name={item.icon} className="h-4 w-4 shrink-0" />
                          {!sidebarCollapsed && <span className="min-w-0 flex-1 truncate">{item.label}</span>}
                        </button>
                      );
                    })}
                  </div>
                </div>
              ))}
            </nav>
          </div>
        </aside>
      );
    }

    function PageHeader({ activeView, isPersonalOpsOpen, setIsPersonalOpsOpen, mobileNavOpen, setMobileNavOpen }) {
      return (
        <div className="flex flex-col gap-4 xl:flex-row xl:items-center xl:justify-between">
          <div className="min-w-0">
            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={() => setMobileNavOpen && setMobileNavOpen(true)}
                className="lg:hidden flex h-11 w-11 items-center justify-center rounded-xl border border-brand-teal-100/50 bg-white/70 text-brand-teal-600 shadow-sm active:bg-white active:scale-[0.985] touch-manipulation"
                title="Open navigation"
                aria-label="Open navigation"
              >
                <Icon name="menu" className="h-5 w-5" />
              </button>
              <ToneBadge tone="teal">{activeView.group || 'MODULE'}</ToneBadge>
              
            </div>
            <h2 className="mt-3 font-heading text-2xl font-extrabold tracking-tight text-brand-teal-700 md:text-3xl">{activeView.title}</h2>
            <p className="mt-1 max-w-4xl text-sm leading-relaxed text-slate-500 font-medium">{activeView.description}</p>
          </div>
          <div className="flex shrink-0 flex-wrap items-center gap-3">
            {activeView.cta ? (
              <button className="px-4 py-1.5 rounded-full text-xs font-bold bg-[#ea580c] text-white hover:bg-[#c2410c] shadow-sm active:scale-[0.985]">{activeView.cta}</button>
            ) : null}
            {activeView.secondary ? (
              <button className="px-4 py-1.5 rounded-full text-xs font-bold border border-[#e2e8f0] text-slate-600 hover:bg-slate-50">{activeView.secondary}</button>
            ) : null}
            {[
              ['calendar-days', 'Calendar'],
              ['bell', 'Notifications'],
              ['user-round', 'User profile'],
            ].map(([icon, label], index) => (
              <button key={label} title={label} onClick={index === 2 ? () => setIsPersonalOpsOpen(!isPersonalOpsOpen) : undefined} className={`relative flex items-center justify-center shadow-sm transition hover-lift active:scale-[0.985] touch-manipulation min-h-[44px] min-w-[44px] h-11 w-11 ${index === 2 ? 'rounded-full' : 'rounded-xl'} ${(index === 2 && isPersonalOpsOpen) ? 'bg-[#004142] text-white border-transparent ring-2 ring-brand-teal-400 ring-offset-2' : 'border border-brand-teal-100/50 text-brand-teal-600 bg-white/70 hover:bg-white'}`}>
                {index === 2 ? <span className="text-[10px] font-extrabold tracking-tighter">TP</span> : <Icon name={icon} className={`h-5 w-5`} />}
                {index === 1 && <span className="absolute right-2 top-2 h-2.5 w-2.5 border-2 border-white rounded-full bg-brand-orange-500 animate-pulse"></span>}
              </button>
            ))}
          </div>
        </div>
      );
    }

    function TopBar({ activeView, isPersonalOpsOpen, setIsPersonalOpsOpen, mobileNavOpen, setMobileNavOpen }) {
      return (
        <section className="px-4 py-6 md:px-8 z-10 relative">
          <PageHeader activeView={activeView} isPersonalOpsOpen={isPersonalOpsOpen} setIsPersonalOpsOpen={setIsPersonalOpsOpen} mobileNavOpen={mobileNavOpen} setMobileNavOpen={setMobileNavOpen} />
        </section>
      );
    }

    
    function PersonalOpsDrawer({ onClose, onLogout }) {
      const focusItems = [
        ['Missing disclosure signature', 'GV-FM-006 - Due today', 'Critical', 'orange'],
        ['QAPI minutes packet', 'QA-WF-03 - Due Jun 15', 'Review', 'teal'],
        ['Credential evidence upload', 'HR-PE-001 - Due Jun 16', 'Evidence', 'orange'],
        ['Emergency drill artifact', 'OP-FM-005 - Due Jun 20', 'Ready', 'green'],
      ];
      const workGroups = [
        ['Signatures', 3, 'pen-line', 'orange'],
        ['Evidence', 7, 'folder-open', 'teal'],
        ['Approvals', 4, 'badge-check', 'teal'],
        ['Security', 1, 'key-round', 'orange'],
      ];

      return (
        <aside className="w-full max-w-[380px] xl:w-[380px] lg:shrink-0 border-l border-[#004142]/10 bg-white shadow-[-10px_0_28px_rgba(0,65,66,0.06)] flex flex-col h-full relative z-20 lg:rounded-none rounded-t-3xl lg:static fixed bottom-0 left-0 right-0 lg:max-h-full max-h-[70vh] overflow-auto">
          <header className="border-b border-[#004142]/10 p-5 flex items-start justify-between shrink-0 bg-[#F7FEFF]">
            <div>
              <p className="font-heading text-[10px] font-extrabold uppercase tracking-[0.2em] text-brand-teal-500">Personal Operations</p>
              <h3 className="mt-1 font-heading text-xl font-extrabold text-brand-teal-800">Today's Focus</h3>
            </div>
            
          </header>
          
          <div className="p-5 flex-1 overflow-y-auto bg-[#F7FEFF]">
            <div className="grid grid-cols-5 gap-1.5 mb-6">
              {['2', '5', '3', '7', '4'].map((value, index) => (
                <div key={index} className="rounded-lg border border-brand-teal-100 bg-white p-2 text-center shadow-sm">
                  <div className="text-sm font-heading font-extrabold text-brand-teal-600">{value}</div>
                  <div className="text-[8px] font-bold uppercase tracking-wider text-brand-neutral-400">{['Late', 'Soon', 'Sign', 'Ev', 'Rev'][index]}</div>
                </div>
              ))}
            </div>

            <section className="mt-4">
              <div className="mb-2 flex items-center gap-2">
                <Icon name="alert-circle" className="h-4 w-4 text-brand-orange-500" />
                <h4 className="font-heading text-xs font-extrabold uppercase tracking-wider text-brand-teal-800">Today's focus</h4>
              </div>
              <div className="space-y-2">
                {focusItems.slice(0, 3).map(([title, meta, status, toneName]) => (
                  <div key={title} className="rounded-xl border border-brand-teal-100 bg-white p-3 shadow-sm hover-lift cursor-pointer">
                    <div className="flex items-center justify-between gap-3">
                      <div>
                        <div className="text-xs font-bold text-brand-teal-600">{title}</div>
                        <div className="mt-1 text-[10px] text-brand-neutral-400">{meta}</div>
                      </div>
                      <Icon name="chevron-right" className="h-4 w-4 text-brand-teal-500" />
                    </div>
                  </div>
                ))}
              </div>
            </section>

            <section className="mt-6">
              <div className="mb-2 flex items-center gap-2">
                <Icon name="list-checks" className="h-4 w-4 text-brand-teal-500" />
                <h4 className="font-heading text-xs font-extrabold uppercase tracking-wider text-brand-teal-800">My work queue</h4>
              </div>
              <div className="grid grid-cols-2 gap-2">
                {workGroups.map(([label, value, icon, toneName]) => (
                  <button key={label} className="rounded-xl border border-brand-teal-100 bg-white p-3 text-left shadow-sm hover-lift">
                    <div className="flex items-center justify-between">
                      <Icon name={icon} className={`h-4 w-4 ${toneName === 'orange' ? 'text-brand-orange-500' : 'text-brand-teal-500'}`} />
                      <span className="font-heading text-lg font-extrabold text-brand-teal-600">{value}</span>
                    </div>
                    <div className="mt-2 text-[10px] font-bold uppercase tracking-wider text-brand-neutral-400">{label}</div>
                  </button>
                ))}
              </div>
            </section>
          </div>
          
          <footer className="border-t border-[#004142]/10 p-5 shrink-0 bg-white">
            <button onClick={onLogout} className="w-full rounded-xl bg-slate-100 py-3 text-sm font-bold text-slate-600 transition hover:bg-slate-200 border border-slate-200 shadow-sm flex justify-center items-center gap-2">
              <Icon name="log-out" className="h-4 w-4" />
              Log Out (Demo)
            </button>
          </footer>
        </aside>
      );
    }

    function App() {
      const [activeId, setActiveId] = useState(getInitialViewId);
      const [query, setQuery] = useState('');
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [calendarSwimlaneOpen, setCalendarSwimlaneOpen] = useState(false);
      
      const [isPersonalOpsOpen, setIsPersonalOpsOpen] = useState(window.location.hash === '#personal-ops-panel');
      const [toastMessage, setToastMessage] = useState(null);
      const [mobileNavOpen, setMobileNavOpen] = useState(false);

      const activeView = VIEW_BY_ID[activeId] || VIEW_BY_ID.dashboard;

      useEffect(() => {
        const onHashChange = () => {
          if (window.location.hash === '#personal-ops-panel') {
            setIsPersonalOpsOpen(true);
          } else {
            setActiveId(getInitialViewId());
          }
        };
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
      }, []);
      
      useEffect(() => {
        if (isPersonalOpsOpen) {
          window.location.hash = 'personal-ops-panel';
        } else if (window.location.hash === '#personal-ops-panel') {
          window.location.hash = activeId;
        }
      }, [isPersonalOpsOpen, activeId]);

      useEffect(() => {
        if (toastMessage) {
          const t = setTimeout(() => setToastMessage(null), 3000);
          return () => clearTimeout(t);
        }
      }, [toastMessage]);

      useEffect(() => {
        const onKeyDown = (e) => {
          if (e.key === 'Escape') {
            setIsPersonalOpsOpen(false);
            setMobileNavOpen(false);
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      useEffect(() => {
        const onHashChange = () => setActiveId(getInitialViewId());
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
      }, []);

      useEffect(() => {
        const onCalendarSwimlane = (event) => setCalendarSwimlaneOpen(Boolean(event.detail?.open));
        window.addEventListener('redesign-calendar-swimlane', onCalendarSwimlane);
        return () => window.removeEventListener('redesign-calendar-swimlane', onCalendarSwimlane);
      }, []);

      useEffect(() => {
        setCalendarSwimlaneOpen(false);
      }, [activeId]);

      useEffect(() => {
        if (window.lucide) {
          window.requestAnimationFrame(() => window.lucide.createIcons());
        }
      }, [activeId, query, sidebarCollapsed]);

      const visibleGroups = useMemo(() => {
        if (!query.trim()) return VIEW_GROUPS;
        const q = query.toLowerCase();
        return VIEW_GROUPS
          .map((group) => ({
            ...group,
            items: group.items.filter((item) =>
              item.label.toLowerCase().includes(q) ||
              item.route.toLowerCase().includes(q) ||
              item.group.toLowerCase().includes(q)
            ),
          }))
          .filter((group) => group.items.length > 0);
      }, [query]);

      const goTo = (id) => {
        window.location.hash = id;
        setActiveId(id);
        setMobileNavOpen(false);
      };

      return (
        <AppShell>
          <Sidebar 
            activeView={activeView}
            visibleGroups={visibleGroups}
            sidebarCollapsed={sidebarCollapsed}
            setSidebarCollapsed={setSidebarCollapsed}
            query={query}
            setQuery={setQuery}
            goTo={goTo}
          />

          <main className="min-w-0 flex-1 flex flex-col h-screen overflow-y-auto">
            {!calendarSwimlaneOpen && <TopBar activeView={activeView} mobileNavOpen={mobileNavOpen} setMobileNavOpen={setMobileNavOpen} />}

            <div className={`flex-1 ${calendarSwimlaneOpen ? 'p-4 md:p-8' : 'p-4 pt-6 md:p-8 md:pt-6'}`}>
              {activeView.template !== 'dashboard' && !calendarSwimlaneOpen && activeView.metrics && activeView.metrics.length > 0 && (
                <div className="mb-6 grid grid-cols-2 gap-3 sm:gap-4 md:grid-cols-2 xl:grid-cols-4">
                  {activeView.metrics.map((item) => <MetricCard key={item.label} item={item} />)}
                </div>
              )}
              {renderTemplate(activeView)}
            </div>
          </main>

          {/* Mobile Nav Overlay + Drawer (Agent 19: responsive parity for sidebar) */}
          {mobileNavOpen && (
            <div className="fixed inset-0 z-[60] lg:hidden" role="dialog" aria-modal="true">
              <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={() => setMobileNavOpen(false)} />
              <aside className="absolute left-0 top-0 h-full w-[280px] max-w-[85vw] overflow-y-auto bg-white shadow-xl border-r border-brand-teal-100/60 flex flex-col">
                <div className="flex items-center justify-between px-4 pt-5 pb-3 border-b">
                  <div className="flex items-center gap-2">
                    <span className="font-heading font-extrabold text-brand-teal-700">CareIndeed</span>
                    <span className="text-[10px] uppercase tracking-widest text-slate-400">Nav</span>
                  </div>
                  <button onClick={() => setMobileNavOpen(false)} className="h-11 w-11 flex items-center justify-center rounded-full border border-brand-teal-100/50 text-brand-teal-600 active:bg-brand-neutral-100 touch-manipulation" aria-label="Close navigation">
                    <Icon name="x" className="h-5 w-5" />
                  </button>
                </div>
                <div className="p-4">
                  {!sidebarCollapsed && <div className="rounded-2xl border border-brand-teal-100/50 bg-white/80 p-4 shadow-sm flex items-center justify-between mb-4">
                    <div>
                      <div className="text-2xl font-heading font-extrabold text-brand-teal-700">{ALL_VIEWS.length}</div>
                      <div className="text-[10px] font-heading font-extrabold uppercase tracking-wider text-slate-500">Views</div>
                    </div>
                    <Icon name="activity" className="h-6 w-6 text-brand-teal-400 opacity-50" />
                  </div>}
                  <nav className="space-y-6">
                    {visibleGroups.map((group) => (
                      <div key={group.title}>
                        <div className="mb-2 px-2 text-[10px] font-heading font-extrabold uppercase tracking-[0.2em] text-slate-400">{group.title}</div>
                        <div className="space-y-1">
                          {group.items.map((item) => {
                            const active = item.id === activeView.id;
                            return (
                              <button
                                key={item.id}
                                onClick={() => goTo(item.id)}
                                className={`flex w-full items-center gap-3 rounded-xl px-4 py-3 text-left text-xs font-bold transition touch-manipulation active:scale-[0.985] ${active ? 'bg-[#004142] text-white shadow-md' : 'text-slate-600 hover:bg-brand-teal-50 hover:text-brand-teal-700'}`}
                              >
                                <Icon name={item.icon} className="h-4 w-4 shrink-0" />
                                <span className="min-w-0 flex-1 truncate">{item.label}</span>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </nav>
                </div>
              </aside>
            </div>
          )}
        </AppShell>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
