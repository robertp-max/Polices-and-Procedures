AWSTemplateFormatVersion: '2010-09-09'
Description: >
  HHC Staging — Per-Lambda least-privilege execution roles, plus a
  scoped deployment role for the GitHub Actions deploy workflow.
  Aligned with Plan §6.

Parameters:
  S3BucketName:
    Type: String
    Description: Staging bucket created by 01-buckets.sh
  DynamoTableName:
    Type: String
    Description: compliance_objects table created by 02-dynamodb.sh
  Environment:
    Type: String
    Default: staging
    AllowedValues: [staging]

Resources:

  # ─── 1. metadata-api  (read DDB; CW logs) ────────────────────
  MetadataApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub hhc-${Environment}-lambda-metadata-api
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ddb-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableName}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableName}/index/*

  # ─── 2. upload-init  (write DDB upload row; presign PUT to sandbox/raw) ───
  UploadInitRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub hhc-${Environment}-lambda-upload-init
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ddb-write-upload-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableName}
        - PolicyName: s3-presign-raw-upload
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub arn:aws:s3:::${S3BucketName}/uploads/raw/*

  # ─── 3. upload-validate-promote  (read raw; write validated/evidence; audit) ───
  ValidatePromoteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub hhc-${Environment}-lambda-validate-promote
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: s3-validate-promote
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ s3:GetObject ]
                Resource: !Sub arn:aws:s3:::${S3BucketName}/uploads/raw/*
              - Effect: Allow
                Action: [ s3:PutObject, s3:CopyObject ]
                Resource:
                  - !Sub arn:aws:s3:::${S3BucketName}/uploads/validated/*
                  - !Sub arn:aws:s3:::${S3BucketName}/evidence/*
              - Effect: Deny
                Action: [ s3:DeleteObject, s3:DeleteObjectVersion ]
                Resource: !Sub arn:aws:s3:::${S3BucketName}/evidence/*
        - PolicyName: ddb-write-meta-and-audit
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ dynamodb:PutItem, dynamodb:UpdateItem ]
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableName}
              # Append-only audit: explicitly deny update/delete on AUDIT# pk
              - Effect: Deny
                Action: [ dynamodb:UpdateItem, dynamodb:DeleteItem ]
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableName}
                Condition:
                  ForAnyValue:StringLike:
                    dynamodb:LeadingKeys: [ "AUDIT#*" ]

  # ─── 4. export-zip  (read evidence; write exports; query DDB) ───
  ExportZipRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub hhc-${Environment}-lambda-export-zip
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: s3-export
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ s3:GetObject ]
                Resource: !Sub arn:aws:s3:::${S3BucketName}/evidence/*
              - Effect: Allow
                Action: [ s3:PutObject ]
                Resource: !Sub arn:aws:s3:::${S3BucketName}/exports/*
        - PolicyName: ddb-query
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ dynamodb:Query, dynamodb:GetItem ]
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableName}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableName}/index/*

  # ─── 5. Deploy role (assumed by GitHub Actions OIDC, future) ───
  # Documented here for visibility; the trust policy is left as a
  # placeholder until the GitHub OIDC provider ARN is known.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub hhc-${Environment}-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              # Replace this with the GitHub OIDC federated principal once
              # the OIDC provider is registered in the AWS account.
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                # Restrict by repo + ref when OIDC is wired:
                # token.actions.githubusercontent.com:sub: "repo:OWNER/REPO:ref:refs/heads/staging"
                aws:RequestTag/env: !Ref Environment
      Policies:
        - PolicyName: deploy-staging-resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:*
                  - lambda:*
                  - apigateway:*
                  - logs:*
                  - iam:PassRole
                Resource: '*'
              - Effect: Allow
                Action: [ s3:*, dynamodb:* ]
                Resource:
                  - !Sub arn:aws:s3:::${S3BucketName}
                  - !Sub arn:aws:s3:::${S3BucketName}/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableName}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTableName}/*
              - Effect: Deny
                # Never allow the deploy role to write production resources.
                Action: '*'
                Resource: '*'
                Condition:
                  StringEqualsIfExists:
                    aws:ResourceTag/env: prod

Outputs:
  MetadataApiRoleArn:    { Value: !GetAtt MetadataApiRole.Arn }
  UploadInitRoleArn:     { Value: !GetAtt UploadInitRole.Arn }
  ValidatePromoteRoleArn:{ Value: !GetAtt ValidatePromoteRole.Arn }
  ExportZipRoleArn:      { Value: !GetAtt ExportZipRole.Arn }
  DeployRoleArn:         { Value: !GetAtt DeployRole.Arn }
