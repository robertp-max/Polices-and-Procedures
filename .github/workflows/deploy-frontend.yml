# ─────────────────────────────────────────────────────────────────────────────
# deploy-frontend.yml — Safe frontend deploy to S3 + CloudFront
#
# Triggers:
#   • push to main    → deploys to prod
#   • push to staging → deploys to staging
#   • workflow_dispatch (manual) with environment choice
#
# Strategy (safe deploy — zero downtime, easy rollback):
#   1. Build Vite app (npm run build → dist/)
#   2. Upload dist/assets/* with 1-year immutable cache headers
#      (Vite content-hashes all filenames — these never need invalidation)
#   3. Upload all other root files with 1-hour cache
#   4. Upload index.html LAST with no-cache headers  ← atomic switch point
#      Users who request index.html after this point get the new build.
#   5. Save versioned snapshot to s3://bucket/releases/<git-sha>/  ← rollback
#   6. CloudFront invalidation for /index.html only
#      (hashed assets never need invalidation — their URLs change on content change)
#
# Rollback:
#   bash infra/frontend-cdk/scripts/rollback.sh <git-sha> staging|prod
#
# Required GitHub Secrets:
#   GH_ACTIONS_ROLE_ARN_STAGING  — from CfnOutput "DeployRoleArn" (staging stack)
#   GH_ACTIONS_ROLE_ARN_PROD     — from CfnOutput "DeployRoleArn" (prod stack)
#
# These ARNs are output by `cdk deploy` — see infra/frontend-cdk/README section.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy Frontend → S3 + CloudFront

on:
  push:
    branches:
      - main      # → prod
      - staging   # → staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - prod

# Never cancel an in-flight deploy — let it finish or fail cleanly.
# This prevents partial uploads leaving the site in a broken state.
concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # Required for OIDC AWS authentication

jobs:
  deploy:
    name: >
      Deploy ·
      ${{
        github.event_name == 'workflow_dispatch'
          && inputs.environment
          || (github.ref_name == 'main' && 'prod' || 'staging')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Resolve target environment once — referenced by all subsequent steps.
      ENV: >-
        ${{
          github.event_name == 'workflow_dispatch'
            && inputs.environment
            || (github.ref_name == 'main' && 'prod' || 'staging')
        }}
      AWS_REGION: us-west-2

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js + dependency cache ─────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ── Vite production build ──────────────────────────────────────────────
      - name: Build (Vite production)
        run: npm run build
        env:
          NODE_ENV: production

      # Confirm dist/index.html was produced before touching AWS.
      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "ERROR: dist/index.html missing"; exit 1; }
          echo "Build output verified. $(find dist -type f | wc -l) files in dist/"

      # ── AWS Auth (OIDC — no long-lived secrets) ────────────────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: >-
            ${{
              env.ENV == 'prod'
                && secrets.GH_ACTIONS_ROLE_ARN_PROD
                || secrets.GH_ACTIONS_ROLE_ARN_STAGING
            }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Resolve deployment targets from CloudFormation outputs ────────────
      # This avoids hard-coding the bucket name and distribution ID in secrets.
      # The CDK stack exports them as named outputs.
      - name: Resolve S3 bucket + CloudFront distribution ID
        id: cf-outputs
        run: |
          STACK="CiPolicyFrontend-${ENV}"

          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)

          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)

          if [[ -z "$BUCKET" || "$BUCKET" == "None" ]]; then
            echo "ERROR: Could not resolve BucketName from CloudFormation stack $STACK"
            exit 1
          fi
          if [[ -z "$DIST_ID" || "$DIST_ID" == "None" ]]; then
            echo "ERROR: Could not resolve DistributionId from CloudFormation stack $STACK"
            exit 1
          fi

          echo "bucket=$BUCKET"   >> "$GITHUB_OUTPUT"
          echo "dist_id=$DIST_ID" >> "$GITHUB_OUTPUT"
          echo "::notice ::Target bucket: $BUCKET  distribution: $DIST_ID"

      # ── Safe S3 Upload — four ordered steps ───────────────────────────────

      # Step A: Upload hashed assets first.
      # Vite content-hashes all filenames in dist/assets/ — these are truly
      # immutable.  Upload them before index.html so they exist in S3 before
      # any client can request the new index.html that references them.
      - name: "Upload: /assets/* (immutable, 1-year cache)"
        run: |
          aws s3 sync dist/assets/ "s3://${{ steps.cf-outputs.outputs.bucket }}/assets/" \
            --cache-control "public, max-age=31536000, immutable" \
            --no-progress \
            --only-show-errors

      # Step B: Upload all other root-level static files (favicon, robots.txt, etc.)
      # Exclude index.html and assets/* — handled in separate steps.
      - name: "Upload: root static files (1-hour cache)"
        run: |
          aws s3 sync dist/ "s3://${{ steps.cf-outputs.outputs.bucket }}/" \
            --exclude "index.html" \
            --exclude "assets/*" \
            --exclude "releases/*" \
            --cache-control "public, max-age=3600" \
            --no-progress \
            --only-show-errors

      # Step C: Upload index.html LAST — this is the atomic "switch" point.
      # Any CloudFront request for index.html after this step returns the new
      # build.  All referenced hashed assets already exist (uploaded in step A).
      - name: "Upload: index.html (no-cache — atomic deploy switch)"
        run: |
          aws s3 cp dist/index.html \
            "s3://${{ steps.cf-outputs.outputs.bucket }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate, max-age=0" \
            --content-type "text/html; charset=utf-8" \
            --no-progress

      # Step D: Save versioned snapshot under releases/<sha>/ for rollback.
      # This copy is independent of the live root — it will not be served by
      # CloudFront unless you explicitly rollback to it.
      - name: "Save rollback snapshot (releases/${{ github.sha }}/)"
        run: |
          aws s3 sync dist/ \
            "s3://${{ steps.cf-outputs.outputs.bucket }}/releases/${{ github.sha }}/" \
            --no-progress \
            --only-show-errors
          echo "::notice ::Rollback snapshot: releases/${{ github.sha }}/"

      # ── CloudFront Invalidation ────────────────────────────────────────────
      # Only /index.html is invalidated.
      # /assets/* files are never invalidated — their content-hashed URLs
      # change automatically when Vite produces a new build.
      # Minimal invalidation = faster propagation + no unnecessary cache churn.
      - name: "Invalidate CloudFront /index.html"
        id: invalidation
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cf-outputs.outputs.dist_id }}" \
            --paths "/index.html" \
            --query "Invalidation.Id" \
            --output text)

          echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"
          echo "::notice ::CloudFront invalidation created: $INVALIDATION_ID"

      # ── Job Summary ───────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          CF_DOMAIN=$(aws cloudfront get-distribution \
            --id "${{ steps.cf-outputs.outputs.dist_id }}" \
            --query "Distribution.DomainName" \
            --output text)

          {
            echo "## Deploy Complete ✓"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Environment | \`${ENV}\` |"
            echo "| Git SHA | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| URL | https://${CF_DOMAIN} |"
            echo "| S3 Bucket | \`${{ steps.cf-outputs.outputs.bucket }}\` |"
            echo "| Distribution ID | \`${{ steps.cf-outputs.outputs.dist_id }}\` |"
            echo "| Invalidation ID | \`${{ steps.invalidation.outputs.invalidation_id }}\` |"
            echo "| Rollback snapshot | \`releases/${{ github.sha }}/\` |"
            echo ""
            echo "### Rollback command"
            echo '```bash'
            echo "bash infra/frontend-cdk/scripts/rollback.sh ${{ github.sha }} ${ENV}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
